<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Locked page</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090d; --panel: #0d1117; --ink: #e6edf3; --muted: #8b98a5;
    --field: #090c11; --line: #222b36; --line-strong: #33404e;
    --accent: #3cc8b4; --accent-ink: #04110f; --accent-soft: rgba(60, 200, 180, .18); --error: #f47067;
    --mono: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  html {
    background:
      radial-gradient(50rem 32rem at 50% -8%, rgba(60, 200, 180, .07), transparent 65%),
      var(--bg) fixed;
  }
  body {
    display: grid; place-items: center; min-height: 100vh; padding: 1rem;
    color: var(--ink); background: transparent;
    font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* A faint static grid behind the card */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 65%);
    mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 65%);
  }

  main {
    width: 100%; max-width: 34rem; padding: 2.25rem 2rem 2rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 24px 60px -24px rgba(0, 0, 0, .8);
    animation: enter .4s ease-out both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }

  .tag {
    display: inline-flex; align-items: center; gap: .5rem; margin: 0 0 1.5rem;
    color: var(--muted); font-size: .75rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  h1 { margin: 0 0 .5rem; font-size: 1.625rem; font-weight: 600; line-height: 1.2; letter-spacing: -.015em; }
  .lede { margin: 0 0 1.75rem; color: var(--muted); font-size: .9375rem; }
  label { display: block; margin: 1.25rem 0 .4rem; font-size: .8125rem; font-weight: 500; }
  label:first-child { margin-top: 0; }
  .row { display: flex; gap: .5rem; }
  .row.wrap { flex-wrap: wrap; }
  .row.wrap input { flex: 999 1 17rem; }
  .actions { display: flex; flex: 1 0 auto; gap: .5rem; }
  .actions button { flex: 1; }
  input, button { font: inherit; border-radius: 8px; padding: .65rem .85rem; }
  input {
    flex: 1; min-width: 0; width: 100%; color: var(--ink); caret-color: var(--accent);
    background: var(--field); border: 1px solid var(--line-strong);
    transition: border-color .15s, box-shadow .15s;
  }
  input:hover { border-color: #45525f; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.code { font-family: var(--mono); font-size: .8125rem; }
  input[type="file"] { padding: .45rem; font-size: .875rem; color: var(--muted); cursor: pointer; }
  input[type="file"]::file-selector-button {
    margin-right: .75rem; padding: .35rem .75rem; border: 1px solid var(--line-strong); border-radius: 6px;
    background: #161c24; color: var(--ink); font: inherit; font-weight: 500; cursor: pointer;
  }
  button {
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: .9375rem; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: #52d6c3; border-color: #52d6c3; }
  button.quiet { border-color: var(--line-strong); background: transparent; color: var(--ink); }
  button.quiet:hover:not(:disabled) { background: #161c24; border-color: #45525f; }
  button.wide { width: 100%; margin-top: 1.5rem; }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg { min-height: 1.5rem; margin: .875rem 0 0; color: var(--error); font-size: .875rem; }
  .msg.info { color: var(--muted); }

  /* The picked folder's files, to tick the ones to include */
  #picker { margin-top: 1.25rem; }
  .tree {
    max-height: 20rem; overflow: auto; padding: .375rem 0;
    background: var(--field); border: 1px solid var(--line-strong); border-radius: 8px;
    font-size: .875rem;
  }
  .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree .item {
    display: flex; align-items: center; gap: .5rem; min-width: 0;
    padding: .2rem .75rem .2rem calc(.75rem + var(--depth, 0) * 1.125rem);
  }
  .tree .item:hover { background: #121821; }
  .tree label { display: flex; align-items: center; gap: .5rem; flex: 1; min-width: 0; margin: 0; font-weight: 400; cursor: pointer; }
  .tree input[type="checkbox"] { flex: none; width: 1rem; height: 1rem; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .tree .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree .folder > .item .name { font-weight: 500; }
  .tree .hidden-file > .item .name { color: var(--muted); }
  .tree .size { flex: none; margin-left: auto; color: var(--muted); font: .75rem/1.4 var(--mono); }
  .tree .spacer { flex: none; width: 1.25rem; }
  button.twisty {
    flex: none; display: grid; place-items: center; width: 1.25rem; height: 1.25rem; padding: 0;
    border: 0; border-radius: 4px; background: transparent; color: var(--muted);
  }
  button.twisty:hover:not(:disabled) { background: #1b2430; border: 0; color: var(--ink); }
  button.twisty svg { transition: transform .15s; }
  button.twisty[aria-expanded="true"] svg { transform: rotate(90deg); }
  .tree-summary { margin: .5rem 0 0; color: var(--muted); font-size: .8125rem; }
  .size-row { align-items: center; }
  .size-row input { flex: 0 0 7rem; }
  .unit { color: var(--muted); font-size: .875rem; }
  .hint { margin: .5rem 0 0; color: var(--muted); font-size: .8125rem; }
  /* Once unlocked: the site fills the window */
  html.unlocked, html.unlocked body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
  html.unlocked body { display: block; min-height: 0; }
  html.unlocked body::before { display: none; }
  iframe.site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <!-- Visitors see this -->
  <section id="gate">
    <p class="tag">Restricted</p>
    <h1>This page is private</h1>
    <p class="lede">Enter your access code to continue.</p>
    <form id="unlockForm">
      <label for="code">Access code</label>
      <div class="row">
        <input id="code" type="password" autocomplete="current-password" required>
        <button id="unlock">Unlock</button>
      </div>
      <p id="gateMsg" class="msg" role="alert"></p>
    </form>
  </section>

  <!-- You see this at index.html?setup -->
  <section id="setup" hidden>
    <p class="tag">Setup</p>
    <h1>Encrypt a site</h1>
    <p class="lede">Nothing is uploaded. The folder is encrypted in this browser and saved to your device as numbered files.</p>
    <form id="encryptForm">
      <label for="folder">Folder to protect (with index.html at its top level)</label>
      <input id="folder" type="file" webkitdirectory required>
      <div id="picker" hidden>
        <label id="treeLabel">Files to include</label>
        <div id="tree" class="tree" aria-labelledby="treeLabel"></div>
        <p id="treeSummary" class="tree-summary" aria-live="polite"></p>
      </div>
      <label for="partSize">Maximum file size</label>
      <div class="row size-row">
        <input id="partSize" type="number" min="1" max="2000" step="1" inputmode="numeric" required aria-describedby="partSizeHint">
        <span class="unit">MB</span>
      </div>
      <p id="partSizeHint" class="hint">The encrypted site is saved as numbered files of at most this size.</p>
      <label for="newCode">Access code</label>
      <div class="row wrap">
        <input id="newCode" class="code" type="text" autocomplete="off" spellcheck="false" required>
        <div class="actions">
          <button id="generate" class="quiet" type="button">Generate</button>
          <button id="copy" class="quiet" type="button">Copy</button>
        </div>
      </div>
      <button id="encrypt" class="wide">Encrypt and save</button>
      <p id="setupMsg" class="msg" role="alert"></p>
    </form>
  </section>
</main>

<script>
  const ENTRY = 'index.html';      // the folder's page that opens after unlocking
  const ITERATIONS = 250000;       // PBKDF2 rounds; must match between encrypt and unlock

  /* crypto:start */
  // Encrypted file layout (published split into parts named by partName): a header, then chunks of the encrypted archive.
  //   header: "LCK1" | 16-byte salt | chunk size (uint32) | encrypted file size (float64)
  //   chunk:  12-byte IV | AES-256-GCM ciphertext of up to `chunk size` bytes
  // Each chunk is authenticated with its index and whether it is the last one, so chunks can't be
  // reordered, swapped or cut off. The plaintext is the gzipped archive:
  //   manifest length (uint32) | manifest JSON [{path, size, type}] | each file's bytes, in manifest order
  const MAGIC = [0x4c, 0x43, 0x4b, 0x31];
  const HEADER = 32;
  const CHUNK = 4 << 20;
  // The encrypted file is published split into parts named by partName. PART_SIZE is the default part size
  // (setup mode can choose another); unlocking works with parts of any size.
  const PART_SIZE = 20 << 20;
  const partName = (index) => 'site-' + String(index).padStart(3, '0') + '.enc';
  const TYPES = {
    html: 'text/html', htm: 'text/html', js: 'text/javascript', mjs: 'text/javascript', css: 'text/css',
    json: 'application/json', wasm: 'application/wasm', txt: 'text/plain', svg: 'image/svg+xml',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', ico: 'image/x-icon',
    mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav', mp4: 'video/mp4', webm: 'video/webm',
  };

  function typeFor(path) {
    return TYPES[path.split('.').pop().toLowerCase()] || 'application/octet-stream';
  }

  async function deriveKey(code, salt) {
    const material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-512' },
      material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  function chunkData(index, last) {
    const data = new Uint8Array(5);
    new DataView(data.buffer).setUint32(0, index);
    data[4] = last ? 1 : 0;
    return data;
  }

  async function sealChunk(key, plain, index, last) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv, additionalData: chunkData(index, last) }, key, plain);
    return new Blob([iv, cipher]);
  }

  // entries: [{path, file}], where file is a File or Blob. Resolves to the encrypted Blob.
  async function encryptArchive(entries, code, onProgress) {
    const manifest = new TextEncoder().encode(JSON.stringify(
      entries.map(({ path, file }) => ({ path, size: file.size, type: typeFor(path) }))));
    const head = new Uint8Array(4 + manifest.length);
    new DataView(head.buffer).setUint32(0, manifest.length);
    head.set(manifest, 4);
    const archive = new Blob([head, ...entries.map(entry => entry.file)]);

    let done = 0;
    const reader = archive.stream()
      .pipeThrough(new TransformStream({
        transform(bytes, out) { done += bytes.length; onProgress(done / archive.size); out.enqueue(bytes); },
      }))
      .pipeThrough(new CompressionStream('gzip'))
      .getReader();

    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(code, salt);
    const chunks = [];
    let buffer = new Uint8Array(CHUNK), fill = 0;
    for (;;) {
      const { done: finished, value } = await reader.read();
      if (finished) break;
      for (let at = 0; at < value.length;) {
        if (fill === CHUNK) {
          // More bytes follow, so this full chunk isn't the last one.
          chunks.push(await sealChunk(key, buffer, chunks.length, false));
          buffer = new Uint8Array(CHUNK); fill = 0;
        }
        const take = Math.min(CHUNK - fill, value.length - at);
        buffer.set(value.subarray(at, at + take), fill);
        fill += take; at += take;
      }
    }
    chunks.push(await sealChunk(key, buffer.subarray(0, fill), chunks.length, true));

    const header = new Uint8Array(HEADER);
    const view = new DataView(header.buffer);
    header.set(MAGIC); header.set(salt, 4);
    view.setUint32(20, CHUNK);
    view.setFloat64(24, HEADER + chunks.reduce((sum, chunk) => sum + chunk.size, 0));
    return new Blob([header, ...chunks], { type: 'application/octet-stream' });
  }

  // Reads a byte stream in pieces of a chosen size, however the network splits it up.
  function byteReader(stream, onBytes) {
    const reader = stream.getReader();
    const pieces = [];
    let held = 0, ended = false;

    async function fillTo(n) {
      while (held < n && !ended) {
        const { done, value } = await reader.read();
        if (done) { ended = true; break; }
        pieces.push(value); held += value.length; onBytes(value.length);
      }
    }

    return {
      // Up to n bytes; fewer only at the end of the stream.
      async read(n) {
        await fillTo(n);
        const out = new Uint8Array(Math.min(n, held));
        for (let at = 0; at < out.length;) {
          const piece = pieces[0], take = Math.min(piece.length, out.length - at);
          out.set(piece.subarray(0, take), at);
          at += take;
          if (take === piece.length) pieces.shift(); else pieces[0] = piece.subarray(take);
        }
        held -= out.length;
        return out;
      },
      async atEnd() { await fillTo(1); return held === 0; },
      cancel() { reader.cancel().catch(() => {}); },
    };
  }

  // Resolves to {path: Blob}. Rejects with Error('wrong-code') if the code doesn't match the first
  // chunk, Error('damaged') if the encrypted file isn't intact, or a network error if the download fails.
  async function decryptArchive(stream, code, onProgress) {
    let received = 0, size = Infinity;
    const input = byteReader(stream, bytes => { received += bytes; onProgress(Math.min(received / size, 1)); });
    try {
      const header = await input.read(HEADER);
      if (header.length < HEADER || MAGIC.some((byte, i) => header[i] !== byte)) throw new Error('damaged');
      const view = new DataView(header.buffer);
      const chunkSize = view.getUint32(20);
      size = view.getFloat64(24);
      const key = await deriveKey(code, header.slice(4, 20));

      const gunzip = new DecompressionStream('gzip');
      const writer = gunzip.writable.getWriter();
      const archive = new Response(gunzip.readable).blob();
      archive.catch(() => {}); // failures surface through the loop below
      try {
        for (let index = 0, last = false; !last; index++) {
          const sealed = await input.read(12 + chunkSize + 16);
          last = await input.atEnd();
          if (sealed.length < 12 + 16) throw new Error('damaged');
          let plain;
          try {
            plain = await crypto.subtle.decrypt(
              { name: 'AES-GCM', iv: sealed.subarray(0, 12), additionalData: chunkData(index, last) },
              key, sealed.subarray(12));
          } catch (err) {
            throw new Error(index === 0 ? 'wrong-code' : 'damaged');
          }
          await writer.write(new Uint8Array(plain));
        }
        await writer.close();
      } catch (err) {
        writer.abort(err).catch(() => {});
        throw err;
      }
      return unpack(await archive);
    } finally {
      input.cancel();
    }
  }

  async function unpack(archive) {
    const length = new DataView(await archive.slice(0, 4).arrayBuffer()).getUint32(0);
    const manifest = JSON.parse(await archive.slice(4, 4 + length).text());
    const files = {};
    let offset = 4 + length;
    for (const { path, size, type } of manifest) {
      files[path] = archive.slice(offset, offset + size, type);
      offset += size;
    }
    return files;
  }

  // The published parts as one byte stream. Parts are fetched in order until they add up to the total size
  // in the header (bytes 24-31 of the first part), so they can be any size. Errors with Error('missing')
  // if a part can't be fetched.
  function partsStream() {
    let index = 0, received = 0, total = Infinity, reader;
    const head = new Uint8Array(HEADER);
    let headFill = 0;
    return new ReadableStream({
      async pull(controller) {
        for (;;) {
          if (!reader) {
            if (received >= total) return controller.close();
            const res = await fetch(partName(index++), { cache: 'no-cache' });
            if (!res.ok || !res.body) throw new Error('missing');
            reader = res.body.getReader();
          }
          const { done, value } = await reader.read();
          if (done) { reader = null; continue; }
          received += value.length;
          if (total === Infinity) {
            const take = Math.min(HEADER - headFill, value.length);
            head.set(value.subarray(0, take), headFill);
            headFill += take;
            if (headFill === HEADER) {
              const size = new DataView(head.buffer).getFloat64(24);
              // A bad header stops after the first part, and fails as 'damaged' once decryptArchive reads it.
              total = size > 0 && size < Number.MAX_SAFE_INTEGER ? size : 0;
            }
          }
          return controller.enqueue(value);
        }
      },
      cancel() { if (reader) reader.cancel().catch(() => {}); },
    });
  }

  function randomCode(length) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'; // 64 chars
    return Array.from(crypto.getRandomValues(new Uint8Array(length)), b => alphabet[b & 63]).join('');
  }
  /* crypto:end */

  const $ = (id) => document.getElementById(id);
  const supported = !!(window.crypto && crypto.subtle && window.CompressionStream && window.DecompressionStream);
  const NEEDS_HTTPS = window.isSecureContext
    ? 'This browser is too old to open this page. Update it and try again.'
    : 'This page only works over HTTPS or on localhost.';

  function say(el, text, kind) { el.className = 'msg ' + (kind || ''); el.textContent = text; }
  const percent = (fraction) => Math.round(100 * fraction) + '%';
  const megabytes = (bytes) => (bytes / 1048576).toFixed(1) + ' MB';

  // Showing the unlocked site. With the service worker (sw.js, next to this page), the site runs in a frame at
  // __site__/<ENTRY> and sw.js answers each request under __site__/ with the decrypted file from `unlocked`, so all
  // relative references work. Without it (no sw.js, or a browser without service workers), the entry page replaces
  // this one with only its own quoted references pointed at the decrypted files (linkFiles).
  const SITE = '__site__/';
  let unlocked = null;  // {path: Blob}, once unlocked

  const worker = ('serviceWorker' in navigator && window.isSecureContext)
    ? Promise.race([
        navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready),
        new Promise(resolve => setTimeout(resolve, 5000)),
      ]).catch(() => null)
    : Promise.resolve(null);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (event) => {
      const { type, path } = event.data || {};
      if (type === 'unlocked-file' && event.ports[0]) event.ports[0].postMessage(unlocked?.[path] || null);
    });
    navigator.serviceWorker.startMessages();
  }

  async function showSite(files) {
    unlocked = files;
    if (await worker) {
      document.documentElement.classList.add('unlocked');
      const frame = element('iframe', 'site');
      frame.title = 'Unlocked site';
      frame.allow = 'fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; screen-wake-lock';
      frame.allowFullscreen = true;
      frame.src = SITE + ENTRY.split('/').map(encodeURIComponent).join('/');
      frame.addEventListener('load', () => {
        try { document.title = frame.contentDocument.title || document.title; } catch (err) {}
        frame.focus();
      });
      document.body.replaceChildren(frame);
      return;
    }
    const html = linkFiles(await files[ENTRY].text(), files);
    document.open(); document.write(html); document.close();
  }

  // Points the entry page's quoted references to the other files ("Build/Web.wasm", './style.css')
  // at their decrypted copies. References inside other files, such as CSS url(), are left as they are.
  function linkFiles(html, files) {
    for (const [path, blob] of Object.entries(files)) {
      if (path === ENTRY) continue;
      const url = URL.createObjectURL(blob);
      for (const quote of ['"', "'"]) {
        for (const ref of [path, './' + path]) html = html.split(quote + ref + quote).join(quote + url + quote);
      }
    }
    return html;
  }

  // Saves the parts into a folder the user picks, or as separate downloads in browsers that can't.
  // pickFolder must be called straight from the click, before any await, or the browser refuses it.
  // Pages can't see the folder they run from, so the picker can't start there. With an id, the browser
  // reopens it in the last folder picked under that id, so pick this page's folder once.
  function pickFolder() {
    return window.showDirectoryPicker
      ? showDirectoryPicker({ id: 'encrypted-site', mode: 'readwrite', startIn: 'documents' })
      : Promise.resolve(null);
  }

  async function saveParts(blob, folder, partSize) {
    const count = Math.ceil(blob.size / partSize);
    for (let index = 0; index < count; index++) {
      const part = blob.slice(index * partSize, (index + 1) * partSize);
      if (folder) {
        const handle = await folder.getFileHandle(partName(index), { create: true });
        const writable = await handle.createWritable();
        await writable.write(part);
        await writable.close();
      } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(part);
        link.download = partName(index);
        document.body.appendChild(link); link.click(); link.remove();
        await new Promise(resolve => setTimeout(resolve, 400)); // browsers drop downloads started too close together
      }
    }
    return count;
  }

  // The picked folder's files, with paths relative to it. Each starts included, except hidden files and
  // files in hidden folders, which can still be ticked in the tree.
  function siteFiles(list) {
    return Array.from(list, file => {
      const path = file.webkitRelativePath.split('/').slice(1).join('/');
      const hidden = path.split('/').some(part => part.startsWith('.'));
      return { file, path, hidden, included: !hidden };
    });
  }

  const size = (bytes) => bytes < 1024 ? bytes + ' B'
    : bytes < 1048576 ? (bytes / 1024).toFixed(1) + ' KB' : megabytes(bytes);

  // The picked folder as a tree: {name, folders: Map, files: [entry], depth}.
  function folderTree(name, entries) {
    const root = { name, folders: new Map(), files: [], depth: 0 };
    for (const entry of entries) {
      let node = root;
      for (const part of entry.path.split('/').slice(0, -1)) {
        if (!node.folders.has(part)) node.folders.set(part, { name: part, folders: new Map(), files: [], depth: node.depth + 1 });
        node = node.folders.get(part);
      }
      node.files.push(entry);
    }
    return root;
  }

  function filesUnder(node) {
    return [...node.files, ...[...node.folders.values()].flatMap(filesUnder)];
  }

  const CHEVRON = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">' +
    '<path d="M3.5 1.5 7 5l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function element(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // One row: [twisty or spacer] [checkbox name] [size].
  function treeRow(depth, name, bytes, box, twisty) {
    const row = element('div', 'item');
    row.style.setProperty('--depth', depth);
    row.append(twisty || element('span', 'spacer'));
    const label = element('label');
    label.append(box, element('span', 'name', name));
    row.append(label, element('span', 'size', size(bytes)));
    return row;
  }

  // Draws the folder's files with a checkbox each; a folder's checkbox ticks or clears everything in it.
  // Only the top folder starts open.
  function renderFolder(node, onChange) {
    const item = element('li', 'folder' + (node.name.startsWith('.') && node.depth > 0 ? ' hidden-file' : ''));
    const files = filesUnder(node);
    node.box = element('input');
    node.box.type = 'checkbox';
    node.box.addEventListener('change', () => {
      for (const entry of files) entry.included = node.box.checked;
      onChange();
    });
    const twisty = element('button', 'twisty');
    twisty.type = 'button';
    twisty.innerHTML = CHEVRON;
    const list = element('ul');
    const open = node.depth === 0;
    twisty.setAttribute('aria-expanded', String(open));
    twisty.setAttribute('aria-label', (open ? 'Collapse ' : 'Expand ') + node.name);
    list.hidden = !open;
    twisty.addEventListener('click', () => {
      list.hidden = !list.hidden;
      twisty.setAttribute('aria-expanded', String(!list.hidden));
      twisty.setAttribute('aria-label', (list.hidden ? 'Expand ' : 'Collapse ') + node.name);
    });
    item.append(treeRow(node.depth, node.name, files.reduce((sum, entry) => sum + entry.file.size, 0), node.box, twisty), list);

    const byName = (a, b) => a.name.localeCompare(b.name);
    for (const folder of [...node.folders.values()].sort(byName)) list.append(renderFolder(folder, onChange));
    for (const entry of [...node.files].sort((a, b) => a.file.name.localeCompare(b.file.name))) {
      const fileItem = element('li', entry.hidden ? 'hidden-file' : '');
      entry.box = element('input');
      entry.box.type = 'checkbox';
      entry.box.addEventListener('change', () => { entry.included = entry.box.checked; onChange(); });
      fileItem.append(treeRow(node.depth + 1, entry.file.name, entry.file.size, entry.box));
      list.append(fileItem);
    }
    return item;
  }

  // Brings every checkbox in line with what's included: a folder is ticked when all of its files are, and
  // shows a dash when only some are.
  function refreshTree(node) {
    let all = true, some = false;
    for (const entry of node.files) {
      entry.box.checked = entry.included;
      all = all && entry.included; some = some || entry.included;
    }
    for (const folder of node.folders.values()) {
      const state = refreshTree(folder);
      all = all && state.all; some = some || state.some;
    }
    node.box.checked = all;
    node.box.indeterminate = some && !all;
    return { all, some };
  }

  let picked = [];  // the picked folder's files, from siteFiles()

  function showPicker() {
    const list = $('folder').files;
    picked = siteFiles(list);
    $('picker').hidden = picked.length === 0;
    $('tree').textContent = '';
    if (!picked.length) return;
    const root = folderTree(list[0].webkitRelativePath.split('/')[0], picked);
    const update = () => {
      refreshTree(root);
      const chosen = picked.filter(entry => entry.included);
      $('treeSummary').textContent = chosen.length + ' of ' + picked.length + ' files selected, ' +
        size(chosen.reduce((sum, entry) => sum + entry.file.size, 0)) + '.';
    };
    const tree = element('ul');
    tree.append(renderFolder(root, update));
    $('tree').append(tree);
    update();
  }

  if (new URLSearchParams(location.search).has('setup')) {
    $('gate').hidden = true;
    $('setup').hidden = false;
    document.title = 'Encrypt a site';
  } else {
    $('code').focus();
  }

  $('unlockForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!supported) return say($('gateMsg'), NEEDS_HTTPS);
    $('unlock').disabled = true;
    say($('gateMsg'), 'Unlocking…', 'info');

    let files;
    try {
      files = await decryptArchive(partsStream(), $('code').value.trim(),
        fraction => say($('gateMsg'), 'Unlocking… ' + percent(fraction), 'info'));
      if (!files[ENTRY]) throw new Error('damaged');
    } catch (err) {
      $('unlock').disabled = false;
      if (err.message === 'wrong-code') {
        say($('gateMsg'), "That code doesn't match. Check it and try again.");
        $('code').select();
      } else if (err.message === 'damaged') {
        say($('gateMsg'), 'The protected files are damaged or incomplete. Ask the owner to publish them again.');
      } else {
        say($('gateMsg'), 'The protected page could not be loaded. Check your connection and try again.');
      }
      return;
    }

    await showSite(files);
  });

  $('folder').addEventListener('change', showPicker);

  $('generate').addEventListener('click', () => {
    if (!supported) return say($('setupMsg'), NEEDS_HTTPS);
    $('newCode').value = randomCode(32);
    say($('setupMsg'), 'Copy this code somewhere safe before you continue. It cannot be recovered.', 'info');
  });

  let copyReset;
  $('copy').addEventListener('click', async () => {
    const code = $('newCode').value.trim();
    if (!code) return say($('setupMsg'), 'There is no code to copy yet. Type one or press Generate.');
    try {
      await navigator.clipboard.writeText(code);
    } catch (err) {
      $('newCode').select();
      return say($('setupMsg'), 'The code could not be copied automatically. It is selected, so copy it by hand.');
    }
    $('copy').textContent = 'Copied';
    clearTimeout(copyReset);
    copyReset = setTimeout(() => { $('copy').textContent = 'Copy'; }, 2000);
  });

  // The maximum file size, in MB: PART_SIZE unless this browser saved another.
  const PART_SIZE_KEY = 'partSizeMB';
  try { $('partSize').value = localStorage.getItem(PART_SIZE_KEY) || PART_SIZE / 1048576; }
  catch (err) { $('partSize').value = PART_SIZE / 1048576; }

  $('encryptForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!supported) return say($('setupMsg'), NEEDS_HTTPS);
    const partMB = Number($('partSize').value);
    if (!Number.isInteger(partMB) || partMB < 1 || partMB > 2000) {
      return say($('setupMsg'), 'Use a whole number from 1 to 2000 for the maximum file size.');
    }
    try { localStorage.setItem(PART_SIZE_KEY, String(partMB)); } catch (err) {}
    const code = $('newCode').value.trim();
    if (code.length < 20) return say($('setupMsg'), 'Use at least 20 characters, or press Generate.');
    if (!picked.some(entry => entry.path === ENTRY)) {
      return say($('setupMsg'), 'That folder has no ' + ENTRY + ' at its top level. Pick the folder that contains it.');
    }
    const entries = picked.filter(entry => entry.included);
    if (!entries.some(entry => entry.path === ENTRY)) {
      return say($('setupMsg'), 'Tick ' + ENTRY + ' in the list: it is the page that opens after unlocking.');
    }
    $('encrypt').disabled = true;

    let folder;
    try {
      folder = await pickFolder();
    } catch (err) {
      $('encrypt').disabled = false;
      return say($('setupMsg'), err.name === 'AbortError'
        ? 'Choose a folder to save the encrypted files in.'
        : 'That folder cannot be used. Pick an empty folder you can write to.');
    }

    let sealed;
    try {
      sealed = await encryptArchive(entries, code,
        fraction => say($('setupMsg'), 'Encrypting ' + entries.length + ' files… ' + percent(fraction), 'info'));
    } catch (err) {
      $('encrypt').disabled = false;
      return say($('setupMsg'), 'The folder could not be encrypted. Pick it again and retry.');
    }

    try {
      say($('setupMsg'), 'Saving…', 'info');
      const count = await saveParts(sealed, folder, partMB * 1048576);
      say($('setupMsg'), 'Saved ' + count + (count === 1 ? ' file, ' : ' files, ') + partName(0) +
        (count > 1 ? ' to ' + partName(count - 1) : '') + ' (' + megabytes(sealed.size) + ' in total, ' +
        partMB + ' MB at most each). ' +
        "Publish them all next to this page. Don't publish the original folder.", 'info');
    } catch (err) {
      say($('setupMsg'), 'The encrypted files could not be saved. Check the folder and try again.');
    } finally {
      $('encrypt').disabled = false;
    }
  });
</script>
</body>
</html>
